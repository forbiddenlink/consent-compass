name: Trigger.dev deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: trigger-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy tasks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fail loudly instead of silently skipping: a missing token means scans
      # would run an outdated task version, or none at all.
      - name: Require TRIGGER_ACCESS_TOKEN
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
        run: |
          if [ -z "$TRIGGER_ACCESS_TOKEN" ]; then
            echo "::error::TRIGGER_ACCESS_TOKEN secret is not set"
            exit 1
          fi

      # CLI version must match the locked @trigger.dev/sdk (4.8.5), never @latest.
      - name: Check CLI version matches the locked SDK
        run: |
          locked=$(node -p "require('./node_modules/@trigger.dev/sdk/package.json').version")
          if [ "$locked" != "4.8.5" ]; then
            echo "::error::Locked @trigger.dev/sdk is $locked, update the CLI pin in this workflow"
            exit 1
          fi

      - name: Deploy to Trigger.dev
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
        run: npx --yes trigger.dev@4.8.5 deploy
